name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: NearbyCore tests
    # macos-26 ships Xcode 26.x, required by the iOS 26 deployment target.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run package tests
        run: swift test

  build:
    name: Build app (simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build Nearby for the simulator
        run: |
          xcodebuild build \
            -project Nearby.xcodeproj \
            -scheme Nearby \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
