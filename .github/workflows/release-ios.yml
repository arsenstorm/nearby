name: Release iOS

# Builds the app and uploads it to App Store Connect (TestFlight) when a
# GitHub release is published — never on pushes to main. workflow_dispatch
# allows manual TestFlight builds from any branch without cutting a release;
# the version then stays at the project's MARKETING_VERSION.
#
# Secrets (Settings → Secrets → Actions): ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_PRIVATE_KEY (App Manager key, .p8 contents), DIST_CERT_P12 (base64),
# DIST_CERT_P12_PASSWORD, DEV_CERT_P12 (base64), DEV_CERT_P12_PASSWORD.
# See docs/app-store/connect-checklist.md.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      # App Manager key: enough for profile management and uploads, not enough
      # to mint cloud-managed certs — the cert comes from the .p12 below.
      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      # The dev cert lets automatic signing reuse one identity for the archive
      # instead of minting a fresh "Created via API" cert on every run.
      - name: Import signing certificates
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_P12_PASSWORD: ${{ secrets.DEV_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign
          printf '%s' "$DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KEYCHAIN" \
            -P "$DEV_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      # Tag v1.2 → MARKETING_VERSION 1.2; any other ref keeps the project's.
      # CFBundleVersion must be unique per upload: run number + attempt.
      - name: Compute versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "MARKETING_VERSION_OVERRIDE=MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION_OVERRIDE=" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      # Automatic signing dev-signs the archive (export re-signs for the store)
      # using the imported dev cert rather than minting one per run.
      - name: Archive
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Nearby.xcodeproj \
            -scheme Nearby \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Nearby.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $MARKETING_VERSION_OVERRIDE

      # One App Store profile per bundle: the app and its Live Activity extension.
      - name: Install app provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.arsenstorm.nearby
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
      - name: Install extension provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.arsenstorm.nearby.activity
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Upload to App Store Connect
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nearby.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
